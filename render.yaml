services:
  - type: web
    name: sabores-espana-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker: rate-limit en memoria coherente en plan free
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sabores-espana-one.vercel.app
      - key: FLASK_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"

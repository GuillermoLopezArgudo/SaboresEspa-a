version: "3.7"

services:
  flask:
    build:
      context: .
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - USE_SQLITE=1
      - JWT_SECRET_KEY=dev-secret-change-me-at-least-32-chars
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    command: python wsgi.py

  vue:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - flask
